<!DOCTYPE html>
<html>
<head>
    <title>Impulse Guard - Phase 2</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 50px; }
        #box {
            width: 400px; height: 300px; margin: 0 auto; background: #16213e; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: pointer;
            border: 5px solid #0fbcf9; border-radius: 20px; transition: background 0.1s;
        }
        .red { background: #e94560 !important; border-color: #ff2e63 !important; }
        .green { background: #0be881 !important; border-color: #05c46b !important; color: #1a1a2e !important; }
        .locked { background: #333 !important; border-color: #555 !important; cursor: not-allowed !important; }
        #next-btn { 
            display: none; margin-top: 30px; padding: 18px 45px; font-size: 20px; font-weight: 800; 
            background: #0be881; color: #1a1a2e; border: none; border-radius: 12px; cursor: pointer;
        }
        .sub-text { font-size: 16px; font-weight: normal; margin-top: 10px; color: #a2a2a2; }
        #tries-left { margin-top: 15px; font-size: 18px; color: #0fbcf9; font-weight: bold; }
    </style>
</head>
<body>

    <h1>PHASE 2: REFLEX CHECK</h1>
    <p>React in under 400ms. 2 total attempts allowed.</p>

    <div id="box">
        <div id="status">CLICK TO START</div>
        <div id="instruction" class="sub-text">Wait for green</div>
    </div>

    <div id="tries-left">Attempts Left: 2</div>

    <button id="next-btn" onclick="window.location.href='speaking-test.html'">Proceed to Speaking Test -></button>

    <script>
        const box = document.getElementById('box');
        const status = document.getElementById('status');
        const instruction = document.getElementById('instruction');
        const btn = document.getElementById('next-btn');
        const triesDisplay = document.getElementById('tries-left');
        
        let state = "IDLE"; 
        let start;
        let timer;
        const THRESHOLD = 400;

        // --- ANTI-CHEAT LOGIC ---
        // Check if we already have attempts saved in the browser memory
        let savedAttempts = sessionStorage.getItem('ig_attempts');
        let attempts = (savedAttempts !== null) ? parseInt(savedAttempts) : 2;
        
        // If they were already locked out before refreshing, keep them locked
        if (attempts <= 0) {
            lockOut();
        } else {
            updateAttempts();
        }

        box.onclick = function() {
            if (attempts <= 0 || state === "LOCKED" || state === "FINISHED") return;

            if (state === "IDLE") {
                state = "WAIT";
                box.className = "red";
                status.innerText = "WAITING...";
                instruction.innerText = "Ready your finger...";
                
                let delay = Math.random() * 2500 + 1500;
                timer = setTimeout(() => {
                    state = "GO";
                    box.className = "green";
                    status.innerText = "GO!!";
                    start = Date.now();
                }, delay);
            } 
            else if (state === "WAIT") {
                clearTimeout(timer);
                useAttempt();
            } 
            else if (state === "GO") {
                let diff = Date.now() - start;
                if (diff < THRESHOLD) {
                    state = "FINISHED";
                    box.className = "green";
                    status.innerText = diff + "ms - PASSED";
                    instruction.innerText = "Reflexes sharp.";
                    btn.style.display = "inline-block";
                } else {
                    useAttempt(diff);
                }
            }
        };

        function useAttempt(time = null) {
            attempts--;
            sessionStorage.setItem('ig_attempts', attempts); // Save to browser memory
            updateAttempts();
            
            if (attempts > 0) {
                state = "IDLE";
                box.className = "";
                status.innerText = time ? time + "ms - TOO SLOW" : "TOO EARLY!";
                instruction.innerText = "Click to use your FINAL attempt.";
            } else {
                lockOut();
            }
        }

        function updateAttempts() {
            triesDisplay.innerText = "Attempts Left: " + attempts;
            if (attempts === 1) triesDisplay.style.color = "#ff3f34";
        }

        function lockOut() {
            state = "LOCKED";
            box.className = "locked";
            status.innerText = "LOCKED OUT";
            instruction.innerText = "You've exhausted your chances for this session.";
            triesDisplay.innerText = "Attempts Left: 0";
            triesDisplay.style.color = "#ff3f34";
        }
    </script>
</body>
</html>
